<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Любимому другу Егору</title>
<style>
    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a1c4fd, #c2e9fb);
        background-size: 400% 400%;
        animation: gradientMove 10s ease infinite;
        font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
        text-align: center;
        padding: 30px;
        box-sizing: border-box;
    }

    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .photo-frame {
        background: #fff;
        padding: 15px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        animation: pop 1s ease;
    }

    @keyframes pop {
        0% { transform: scale(0.8); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    img {
        max-width: 350px;
        width: 100%;
        border-radius: 15px;
        display: block;
    }

    h1 {
        font-size: 36px;
        color: #ff4757;
        text-shadow: 2px 2px 0 #fff, 4px 4px 10px rgba(0,0,0,0.1);
        margin-top: 30px;
        margin-bottom: 10px;
    }

    p.wish {
        font-size: 20px;
        color: #2f3640;
        max-width: 500px;
        line-height: 1.6;
        margin: 10px 0;
        background: rgba(255,255,255,0.6);
        padding: 15px 20px;
        border-radius: 15px;
    }

    .signature {
        margin-top: 20px;
        font-size: 18px;
        font-weight: bold;
        color: #e84118;
    }

    .hearts {
        font-size: 30px;
        margin-top: 10px;
    }
</style>
</head>
<body>

    <div class="photo-frame">
        <img src="egor.jpg" alt="Егор">
    </div>

    <h1>Любимому другу Егору 🎉</h1>

    <p class="wish">
        Желаем тебе самого лучшего в жизни: крепкого здоровья, море счастья, 
        успехов во всех начинаниях и огромной удачи на каждом шагу! 
        Пусть каждый день приносит радость и улыбки! 🌟
    </p>

    <div class="signature">
        С любовью, "Общаковский аристанский круг" 👑
    </div>

    <div class="hearts">❤️🧡💛💚💙💜</div>

</body>
</html>
